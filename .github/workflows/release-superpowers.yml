name: Release Superpowers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in packages/superpowers/package.json to publish
        required: true
        type: string

jobs:
  publish-superpowers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs');

          const version = process.env.VERSION;
          const pkg = JSON.parse(readFileSync('packages/superpowers/package.json', 'utf8'));
          if (pkg.version !== version) {
            console.error(`::error::Requested version ${version} does not match ${pkg.name} version ${pkg.version}`);
            process.exit(1);
          }
          if (pkg.dependencies?.['@aharness/core'] !== 'workspace:*') {
            console.error('::error::@aharness/superpowers must depend on @aharness/core through workspace:* before packing');
            process.exit(1);
          }
          NODE
      - name: Verify @aharness/core is already published
        env:
          VERSION: ${{ inputs.version }}
        run: npm view "@aharness/core@$VERSION" version
      - run: pnpm run build
      - run: pnpm --dir packages/superpowers run package:verify
      - name: Pack @aharness/superpowers
        id: pack-superpowers
        run: |
          mkdir -p "$RUNNER_TEMP/aharness-pack"
          pnpm --dir packages/superpowers pack --pack-destination "$RUNNER_TEMP/aharness-pack" --json > "$RUNNER_TEMP/superpowers-pack.json"
          tarball=$(node -e "const p=require(process.env.RUNNER_TEMP + '/superpowers-pack.json'); const item=Array.isArray(p)?p[0]:p; console.log(item.filename || item.path)")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Publish @aharness/superpowers
        run: npm publish "${{ steps.pack-superpowers.outputs.tarball }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
